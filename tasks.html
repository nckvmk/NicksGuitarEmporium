<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="keywords" content="Vintage, guitars, amps, shop">
    <meta name="description" content="Website for small trading business of vintage guitars and amps">
    <meta name="author" content="Nikos Vamvakas">
    <title>Nick's Guitar Emporium</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"
            integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
            crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css" type="text/css" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=dark_mode" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=light_mode" />
    <link rel="icon" href="images/logo.ico">
    <script src="scripts/tasks.js" defer></script>
    <script src="scripts/theme_switch.js" defer></script>
    <script src="scripts/common.js" defer></script>
</head>

<body>
    <main>
        <div id="nav_placeholder" class="container-auto">
            <!--Placeholder for the navigation bar-->
        </div>

        <h1 class="pt-5">Tasks</h1>
        <h5 id="tasks_page_desc" class="pb-5">A Page to View & Manage Business Tasks</h5>

        <section id="table" class="p-4 container-lg">
            <!--Filter dropdown-->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <label for="filterStatus" class="fw-bold me-2">Filter tasks by status:</label>
                    <select id="filterStatus" class="form-select w-auto d-inline-block">
                        <option value="all">All</option>
                        <option value="Pending">Pending</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-12 px-4 d-flex justify-content-center align-items-center">
                    <!--Table-->
                    <table id="tasks_table" class="table">
                        <thead>
                            <tr>
                                <th>
                                    Task
                                    <button id="sortName" class="btn btn-sm btn-outline-secondary ms-1" title="Sort by task name" aria-label="Sort by task name">
                                        <span id="sortNameIcon">⇅</span>
                                    </button>
                                </th>
                                <th>Description</th>
                                <th>
                                    Due Date
                                    <button id="sortDate" class="btn btn-sm btn-outline-secondary ms-1" title="Sort by due date" aria-label="Sort by due date">
                                        <span id="sortDateIcon">⇅</span>
                                    </button>
                                </th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                            </thead>
                        <tbody>
                            <!-- Tasks will be inserted here dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="tasks_form_section" class="py-5 container-lg">
            <div class="d-flex justify-content-center align-items-center">
                <div class="row">
                    <div id="tasks_form" class="col-lg-7 order-lg-1">
                        <h5 class="tasks_form_desc pt-2" lang="en">To enter a new task, please use the following form:</h5>
                        <form id="tasks" action="#" class="tasks_form py-4" method="post">
                            <div class="row">
                                <div class="col-sm-12 mb-3">
                                    <div class="form-group">
                                        <label class="required-field" for="name">Task Name</label>
                                        <input type="text" class="form-control text-muted" id="name" name="name" placeholder="Enter task name">
                                    </div>
                                </div>
                                <div class="col-sm-12 mb-3">
                                    <div class="form-group">
                                        <label class="required-field" for="description">Task Description</label>
                                        <input type="text" class="form-control text-muted" id="description" name="description" placeholder="Describe the task in short">
                                    </div>
                                </div>
                                <div class="col-sm-12 mb-3">
                                    <div class="form-group">
                                        <label class="required-field" for="deadline">Due Date</label>
                                        <input type="date" class="form-control" id="deadline" name="deadline">
                                    </div>
                                </div>
                                <div id="submit" class="col-sm-12 mb-3">
                                    <button type="submit" name="submit" class="btn btn-primary" aria-label="Submit">Submit</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>


    </main>

    <footer>
        <!--Placeholder for the footer-->
    </footer>
</body>
</html>
